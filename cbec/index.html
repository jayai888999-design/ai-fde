.node:hover .ic{transform:translateY(-4px);border-color:rgba(92,214,255,.6);box-shadow:0 0 24px rgba(92,214,255,.18)}
.node.focus .ic{border-color:rgba(92,214,255,.55);background:rgba(92,214,255,.08)}

.node.on svg{stroke:#fff}
.tab{border:1px solid rgba(148,163,184,.2);background:rgba(255,255,255,.03);color:#93A1B8;border-radius:999px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s;min-height:40px}

/* ---------- motion ---------- */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --n{syntax:"<integer>";initial-value:0;inherits:false}
.grad{background-size:200% 100%;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.aurora{position:absolute;inset:-20%;pointer-events:none;filter:blur(60px);opacity:.9}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.aurora i:nth-child(1){width:46vw;height:46vw;left:48%;top:-8%;background:radial-gradient(circle,rgba(63,200,255,.30),transparent 65%);animation:drift1 16s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:40vw;height:40vw;left:4%;top:20%;background:radial-gradient(circle,rgba(139,124,255,.26),transparent 65%);animation:drift2 19s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:30vw;height:30vw;left:62%;top:44%;background:radial-gradient(circle,rgba(192,139,255,.18),transparent 65%);animation:drift3 13s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-14vw,8vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(16vw,-6vh) scale(.9)}}
@keyframes drift3{to{transform:translate(-10vw,-10vh) scale(1.2)}}
.twinkle{animation:tw 3.2s ease-in-out infinite}
.twinkle:nth-child(2n){animation-delay:-1.1s}.twinkle:nth-child(3n){animation-delay:-2.2s}
@keyframes tw{50%{opacity:.25}}
.halo{transform-origin:1180px 270px;animation:halo 3s ease-out infinite}
@keyframes halo{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
.flow-border{position:relative}
.flow-border::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--ang),transparent 0 62%,rgba(92,214,255,.9) 76%,rgba(139,124,255,.9) 86%,transparent 96%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite;pointer-events:none;z-index:2}
@keyframes spin{to{--ang:360deg}}
.hero-vid .frame{transform:perspective(1400px) rotateY(-7deg) rotateX(3deg);transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.hero-vid:hover .frame{transform:perspective(1400px) rotateY(0) rotateX(0)}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{translate:0 -8px}}
.chain-line::after{content:"";position:absolute;top:-3px;width:60px;height:8px;border-radius:8px;background:radial-gradient(closest-side,#fff,rgba(92,214,255,.9) 40%,transparent);filter:blur(1px);animation:packet 3.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes packet{from{left:-4%}to{left:100%}}
.node .ic{position:relative;overflow:hidden}
.node.on .ic::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from var(--ang),transparent 0 70%,rgba(255,255,255,.55) 85%,transparent);animation:spin 2.4s linear infinite;mix-blend-mode:overlay}
.btn-pri{position:relative;overflow:hidden}
.btn-pri::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{60%,100%{left:130%}}
.card,.ph,.way,.wbt,.q{--mx:50%;--my:0%}
.card::after,.ph::after,.way::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(92,214,255,.12),transparent 45%)}
.card,.ph,.way{position:relative}
.card:hover::after,.ph:hover::after,.way:hover::after{opacity:1}
.cnt{counter-reset:n var(--n);animation:count 1.8s cubic-bezier(.2,.7,.2,1) .3s both}
.cnt::before{content:counter(n)}
@keyframes count{from{--n:0}to{--n:var(--to)}}
.cursor-glow{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:1;background:radial-gradient(circle,rgba(92,214,255,.09),rgba(139,124,255,.05) 35%,transparent 65%);transition:opacity .4s;mix-blend-mode:screen}
.hero-in>*{animation:heroIn .9s cubic-bezier(.2,.7,.2,1) both}
.hero-in>*:nth-child(2){animation-delay:.1s}.hero-in>*:nth-child(3){animation-delay:.2s}.hero-in>*:nth-child(4){animation-delay:.3s}.hero-in>*:nth-child(5){animation-delay:.4s}
@keyframes heroIn{from{opacity:0;transform:translateY(24px);filter:blur(6px)}}
.hero-vid{animation:vidIn 1.2s cubic-bezier(.2,.7,.2,1) .25s both}
@keyframes vidIn{from{opacity:0;transform:translateX(40px) scale(.96);filter:blur(8px)}}
@supports (animation-timeline:view()){
 .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
 .rv-kids>*{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 60%}
 @keyframes rv{from{opacity:0;transform:translateY(46px) scale(.97);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}html{scroll-behavior:auto}.cnt::before{content:counter(n)}.cnt{counter-reset:n var(--to)}.cursor-glow,.scan,.aurora{display:none}}
.page{position:relative;isolation:isolate}
.page::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(148,163,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.045) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.25) 18%,#000 40%,rgba(0,0,0,.25) 62%,#000 82%,rgba(0,0,0,.3));mask-image:linear-gradient(180deg,#000 0,rgba(0,0,0,.25) 18%,#000 40%,rgba(0,0,0,.25) 62%,#000 82%,rgba(0,0,0,.3))}
.sec{position:relative;border-top:1px solid rgba(148,163,184,.08)}
.sec::before{content:"";position:absolute;top:-1px;left:50%;width:min(560px,60%);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(92,214,255,.55),rgba(139,124,255,.55),transparent)}
.grad{background:linear-gradient(90deg,#5CD6FF,#8B7CFF 60%,#C08BFF);-webkit-background-clip:text;background-clip:text;color:transparent !important}
.card:hover{border-color:rgba(92,214,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 36px rgba(92,214,255,.10);transform:translateY(-2px)}
.btn-pri{background:linear-gradient(135deg,#3FC8FF,#8B7CFF) !important;color:#05080F !important;border-color:transparent !important;font-weight:700}
.btn-pri:hover{box-shadow:0 0 28px rgba(92,214,255,.4)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));border:1px solid rgba(148,163,184,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.scan{position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(180deg,transparent,rgba(92,214,255,.07),transparent);animation:scan 7s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
</style>

// 极简模板运行时：支持 {{ path }}、<sc-for list as>、<sc-if value>、onClick、DCLogic.setState
(function () {
  var HOLD = /\{\{\s*([^}]+?)\s*\}\}/g;
  var ONE = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
  function get(s, p) {
    p = p.trim();
    if (p === 'false') return false;
    if (p === 'true') return true;
    var ks = p.split('.'), o = s;
    for (var i = 0; i < ks.length; i++) { if (o == null) return undefined; o = o[ks[i]]; }
    return o;
  }
  function str(v) { return v == null || v === false ? '' : String(v); }
  function sig(v) { return JSON.stringify(v, function (k, x) { return typeof x === 'function' ? undefined : x; }); }
  function child(s, k, v) { var c = Object.create(s); c[k] = v; return c; }

  function inst(nodes, ups, parent) {
    for (var i = 0; i < nodes.length; i++) walk(nodes[i], parent, ups);
  }
  function walk(n, parent, ups) {
    if (n.nodeType === 3) {
      var txt = n.nodeValue;
      var tn = document.createTextNode(txt);
      parent.appendChild(tn);
      if (txt.indexOf('{{') >= 0) ups.push(function (s) {
        var v = txt.replace(HOLD, function (m, p) { return str(get(s, p)); });
        if (tn.nodeValue !== v) tn.nodeValue = v;
      });
      return;
    }
    if (n.nodeType !== 1) return;
    var tag = n.localName;
    if (tag === 'sc-for' || tag === 'sc-if') {
      var a = document.createComment(tag), b = document.createComment('/' + tag);
      parent.appendChild(a); parent.appendChild(b);
      var kids = Array.prototype.slice.call(n.childNodes);
      var path = (n.getAttribute(tag === 'sc-for' ? 'list' : 'value') || '').replace(HOLD, '$1');
      var as = n.getAttribute('as'), last = null, items = [];
      ups.push(function (s) {
        var v = get(s, path);
        var list = tag === 'sc-for' ? (v || []) : (v ? [true] : []);
        var g = sig(list);
        if (g !== last) {
          last = g;
          while (a.nextSibling !== b) a.parentNode.removeChild(a.nextSibling);
          items = list.map(function (it) {
            var sc = tag === 'sc-for' ? child(s, as, it) : s;
            var f = document.createDocumentFragment(), u = [];
            inst(kids, u, f);
            u.forEach(function (fn) { fn(sc); });
            b.parentNode.insertBefore(f, b);
            return u;
          });
        } else {
          list.forEach(function (it, i) {
            var sc = tag === 'sc-for' ? child(s, as, it) : s;
            items[i].forEach(function (fn) { fn(sc); });
          });
        }
      });
      return;
    }
    var el = document.importNode(n, false);
    var attrs = Array.prototype.slice.call(n.attributes);
    attrs.forEach(function (at) {
      var name = at.name, val = at.value;
      if (name.indexOf('hint-') === 0 || name === 'key') { el.removeAttribute(name); return; }
      if (val.indexOf('{{') < 0) return;
      el.removeAttribute(name);
      if (name === 'onclick') {
        var p = val.replace(HOLD, '$1'), fn = null;
        ups.push(function (s) { fn = get(s, p); });
        el.addEventListener('click', function (e) { if (typeof fn === 'function') fn(e); });
        return;
      }
      var one = val.match(ONE);
      ups.push(function (s) {
        var v = one ? str(get(s, one[1])) : val.replace(HOLD, function (m, q) { return str(get(s, q)); });
        if (el.getAttribute(name) !== v) el.setAttribute(name, v);
      });
    });
    inst(Array.prototype.slice.call(n.childNodes), ups, el);
    parent.appendChild(el);
  }

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p) {
    var self = this;
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p);
    if (!this._q) { this._q = true; Promise.resolve().then(function () { self._q = false; self._render(); }); }
  };
  window.DCLogic = DCLogic;

  window.mountDC = function (C, props) {
    var tpl = document.getElementById('tpl');
    var app = document.getElementById('app');
    var c = new C(props || {});
    var ups = [], f = document.createDocumentFragment();
    inst(Array.prototype.slice.call(tpl.content.childNodes), ups, f);
    c._render = function () { var v = c.renderVals(); ups.forEach(function (fn) { fn(v); }); };
    c._render();
    app.appendChild(f);
    if (c.componentDidMount) c.componentDidMount();
  };
})();

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dept: 'media', wb: 0, now: Date.now() };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ now: Date.now() }), 15000);
    this.kick();
    setTimeout(() => this.kick(), 600);
    this.fx();
  }
  fx() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (window.matchMedia && !window.matchMedia('(pointer: fine)').matches) return;
    var glow = document.createElement('div');
    glow.className = 'cursor-glow';
    glow.style.opacity = '0';
    var host = document.querySelector('.page') || document.body;
    host.appendChild(glow);
    this.glow = glow;
    this.onMove = function (e) {
      glow.style.opacity = '1';
      glow.style.transform = 'translate3d(' + e.clientX + 'px,' + e.clientY + 'px,0)';
      var el = e.target && e.target.closest ? e.target.closest('.card,.ph,.way') : null;
      if (el) {
        var r = el.getBoundingClientRect();
        el.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        el.style.setProperty('--my', (e.clientY - r.top) + 'px');
      }
    };
    this.onLeave = function () { glow.style.opacity = '0'; };
    document.addEventListener('pointermove', this.onMove, { passive: true });
    document.addEventListener('pointerleave', this.onLeave);
  }
  kick() {
    var vs = document.querySelectorAll('video[data-wb]');
    for (var i = 0; i < vs.length; i++) {
      var v = vs[i];
      v.muted = true;
      if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
    }
  }
  setWb(i) {
    var n = WB.length;
    this.setState({ wb: ((i % n) + n) % n });
    var self = this;
    setTimeout(function () { self.kick(); }, 80);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    if (this.onMove) document.removeEventListener('pointermove', this.onMove);
    if (this.onLeave) document.removeEventListener('pointerleave', this.onLeave);
    if (this.glow && this.glow.parentNode) this.glow.parentNode.removeChild(this.glow);
  }
  pick(id, scroll) {
    this.setState({ dept: id });
    if (scroll) {
      var el = document.getElementById('scenes');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }
  renderVals() {
    var self = this;
    var cur = DEPTS.find(function (d) { return d.id === self.state.dept; }) || DEPTS[0];
    var all = [];
    DEPTS.forEach(function (d) { all = all.concat(d.s); });
    var nBox = all.filter(function (s) { return s.w === 'box'; }).length;
    var nMix = all.filter(function (s) { return s.w === 'mix'; }).length;
    var nOnlyFde = all.filter(function (s) { return s.w === 'fde'; }).length;

    var nc = {}, go = {};
    DEPTS.forEach(function (d) {
      nc[d.id] = 'node' + (d.id === cur.id ? ' on' : (d.star ? ' focus' : ''));
      go[d.id] = function () { self.pick(d.id, true); };
    });

    var now = new Date(this.state.now);
    var clocks = CITIES.map(function (x) {
      var time = new Intl.DateTimeFormat('zh-CN', { timeZone: x.tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
      var h = parseInt(new Intl.DateTimeFormat('en-US', { timeZone: x.tz, hour: 'numeric', hour12: false }).format(now), 10) % 24;
      var day = h >= 9 && h < 21;
      return { c: x.c, code: x.code, time: time, dot: day ? 'dot' : 'dot night', state: day ? '当地白天' : '当地夜间', task: day ? x.day : x.night };
    });

    var W0 = WB[this.state.wb];
    var wbTabs = WB.map(function (w, i) {
      var on = i === self.state.wb;
      return { nm: w.nm, dept: w.dept, cls: on ? 'wbt on' : 'wbt', sel: on ? 'true' : 'false', pick: function () { self.setWb(i); } };
    });

    return {
      platforms: ['Amazon', 'TikTok Shop', 'Shopify', 'Temu', 'Meta Ads', 'EN · DE · FR · JP · ES'],
      systems: ['Amazon SP-API', 'Shopify', '领星 / 马帮 / 积加等 ERP', '金蝶 / 用友', '企业微信'],
      nBox: nBox, nFde: all.length - nBox, nMix: nMix, nOnlyFde: nOnlyFde,
      nc: nc, go: go,
      clocks: clocks,
      tabs: DEPTS.map(function (d) {
        var on = d.id === cur.id;
        return { nm: d.nm, star: !!d.star, cls: on ? 'tab on' : 'tab', sel: on ? 'true' : 'false', pick: function () { self.pick(d.id, false); } };
      }),
      dept: { nm: cur.nm, intro: cur.intro },
      cards: cur.s.map(function (s, i) {
        return { key: cur.id + i, t: s.t, b: s.b, a: s.a, o: s.o, g: s.g, gs: s.gs, tagCls: WAY[s.w][0], tag: WAY[s.w][1] };
      }),
      wbTabs: wbTabs,
      wb: { key: W0.id, nm: W0.nm, dept: W0.dept, src: W0.src, poster: W0.poster, dur: W0.dur, sub: W0.sub, g: W0.g, gs: W0.gs, no: '0' + (this.state.wb + 1),
            pts: W0.pts.map(function (p, i) { return { n: i + 1, t: p }; }) },
      wbPrev: function () { self.setWb(self.state.wb - 1); },
      wbNext: function () { self.setWb(self.state.wb + 1); },
      steps: STEPS,
      phases: PHASES
    };
  }
}
